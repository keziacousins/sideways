services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sideways}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sideways}
      POSTGRES_DB: ${POSTGRES_DB:-sideways}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sideways}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Ory Kratos (Identity) ---

  kratos-migrate:
    build: ./kratos
    command: migrate sql -e --yes
    environment:
      DSN: postgres://${POSTGRES_USER:-sideways}:${POSTGRES_PASSWORD:-sideways}@postgres:5432/kratos?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kratos:
    build: ./kratos
    command: serve -c /etc/kratos/kratos.yml --dev --watch-courier
    restart: unless-stopped
    ports:
      - "4433:4433"
      - "4434:4434"
    environment:
      DSN: postgres://${POSTGRES_USER:-sideways}:${POSTGRES_PASSWORD:-sideways}@postgres:5432/kratos?sslmode=disable
      SERVE_PUBLIC_BASE_URL: ${KRATOS_PUBLIC_URL:-http://localhost:4433}/
      SERVE_ADMIN_BASE_URL: ${KRATOS_ADMIN_URL:-http://localhost:4434}/
      SERVE_PUBLIC_CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:4000}
      SECRETS_COOKIE: ${KRATOS_COOKIE_SECRET:-localhost-kratos-cookie-secret}
      SECRETS_CIPHER: ${KRATOS_CIPHER_SECRET:-localhost-cipher-key-32chars!}
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${PUBLIC_URL:-http://localhost:4000}/
      SELFSERVICE_FLOWS_LOGIN_UI_URL: ${PUBLIC_URL:-http://localhost:4000}/auth/login
      SELFSERVICE_FLOWS_REGISTRATION_UI_URL: ${PUBLIC_URL:-http://localhost:4000}/auth/signup
      SELFSERVICE_FLOWS_RECOVERY_UI_URL: ${PUBLIC_URL:-http://localhost:4000}/auth/forgot-password
      SELFSERVICE_FLOWS_SETTINGS_UI_URL: ${PUBLIC_URL:-http://localhost:4000}/auth/settings
      SELFSERVICE_FLOWS_ERROR_UI_URL: ${PUBLIC_URL:-http://localhost:4000}/auth/error
      SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL: ${PUBLIC_URL:-http://localhost:4000}/auth/login
      SELFSERVICE_FLOWS_REGISTRATION_AFTER_PASSWORD_HOOKS_0_CONFIG_URL: ${API_INTERNAL_URL:-http://host.docker.internal:4100}/api/auth/hooks/registration
      COURIER_SMTP_CONNECTION_URI: ${SMTP_URL:-smtp://mailhog:1025/?disable_starttls=true}
      COURIER_SMTP_FROM_ADDRESS: ${SMTP_FROM:-noreply@sideways.dev}
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Ory Hydra (OAuth2 / JWT) ---

  hydra-migrate:
    build: ./hydra
    command: migrate sql -e --yes
    environment:
      DSN: postgres://${POSTGRES_USER:-sideways}:${POSTGRES_PASSWORD:-sideways}@postgres:5432/hydra?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  hydra:
    build: ./hydra
    command: serve all -c /etc/hydra/hydra.yml --dev
    restart: unless-stopped
    ports:
      - "4444:4444"
      - "4445:4445"
    environment:
      DSN: postgres://${POSTGRES_USER:-sideways}:${POSTGRES_PASSWORD:-sideways}@postgres:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET:-localhost-hydra-system-secret}
      URLS_SELF_ISSUER: ${HYDRA_ISSUER_URL:-http://localhost:4100}
      URLS_LOGIN: ${PUBLIC_API_URL:-http://localhost:4100}/api/auth/login
      URLS_CONSENT: ${PUBLIC_API_URL:-http://localhost:4100}/api/auth/consent
      URLS_LOGOUT: ${PUBLIC_API_URL:-http://localhost:4100}/api/auth/logout
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:4000}
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hydra-init:
    build: ./scripts
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
    depends_on:
      - hydra
    restart: "no"

  # --- SeaweedFS ---

  seaweedfs-master:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: master -ip=seaweedfs-master
    ports:
      - "9333:9333"

  seaweedfs-volume:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: volume -mserver=seaweedfs-master:9333 -port=8080 -ip=seaweedfs-volume
    ports:
      - "8080:8080"
    depends_on:
      - seaweedfs-master
    volumes:
      - swdata:/data

  seaweedfs-filer:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: filer -master=seaweedfs-master:9333
    ports:
      - "8888:8888"
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume

  # --- Mail (dev only) ---

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  swdata:

version: v2.3.0

serve:
  cookies:
    same_site_mode: Lax
  public:
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:4000
      allowed_methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
      allow_credentials: true

strategies:
  access_token: jwt

log:
  level: info
  format: text

ttl:
  access_token: 24h
  refresh_token: 2160h
  id_token: 24h
  auth_code: 10m

oauth2:
  expose_internal_errors: true

oidc:
  dynamic_client_registration:
    enabled: true

# webfinger.oidc_discovery.client_registration_url is set in compose.yml
# via WEBFINGER_OIDC_DISCOVERY_CLIENT_REGISTRATION_URL so it can use the
# same issuer env var as the other URLs. Hydra does not interpolate
# ${VAR} inside its yaml config.

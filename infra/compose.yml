services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sideways
      POSTGRES_PASSWORD: sideways
      POSTGRES_DB: sideways
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sideways"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Ory Kratos (Identity) ---

  kratos-migrate:
    build: ./kratos
    command: migrate sql -e --yes
    environment:
      DSN: postgres://sideways:sideways@postgres:5432/kratos?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kratos:
    build: ./kratos
    command: serve -c /etc/kratos/kratos.yml --dev --watch-courier
    restart: unless-stopped
    ports:
      - "4433:4433"
      - "4434:4434"
    environment:
      DSN: postgres://sideways:sideways@postgres:5432/kratos?sslmode=disable
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Ory Hydra (OAuth2 / JWT) ---

  hydra-migrate:
    build: ./hydra
    command: migrate sql -e --yes
    environment:
      DSN: postgres://sideways:sideways@postgres:5432/hydra?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  hydra:
    build: ./hydra
    command: serve all -c /etc/hydra/hydra.yml --dev
    restart: unless-stopped
    ports:
      - "4444:4444"
      - "4445:4445"
    environment:
      DSN: postgres://sideways:sideways@postgres:5432/hydra?sslmode=disable
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hydra-init:
    build: ./scripts
    depends_on:
      - hydra
    restart: "no"

  # --- SeaweedFS ---

  seaweedfs-master:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: master -ip=seaweedfs-master
    ports:
      - "9333:9333"

  seaweedfs-volume:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: volume -mserver=seaweedfs-master:9333 -port=8080 -ip=seaweedfs-volume
    ports:
      - "8080:8080"
    depends_on:
      - seaweedfs-master
    volumes:
      - swdata:/data

  seaweedfs-filer:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: filer -master=seaweedfs-master:9333
    ports:
      - "8888:8888"
    depends_on:
      - seaweedfs-master
      - seaweedfs-volume

  # --- Mail (dev only) ---

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  swdata:

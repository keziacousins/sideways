version: v2.3.0

serve:
  cookies:
    same_site_mode: Lax
  public:
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:4000
      allowed_methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
      allow_credentials: true

strategies:
  access_token: jwt

log:
  level: info
  format: text

ttl:
  access_token: 24h
  refresh_token: 2160h
  id_token: 24h
  auth_code: 10m

oauth2:
  # `expose_internal_errors: true` leaks Hydra-internal detail (DB errors,
  # schema info, version) in OAuth error responses to clients. Useful in
  # dev — flip on via the OAUTH2_EXPOSE_INTERNAL_ERRORS env var in
  # compose.yml when you need to debug locally.
  expose_internal_errors: false
  # OAuth 2.1 requires PKCE for public clients. Hydra defaults to false for
  # both flags, which would let DCR'd public clients complete the code flow
  # without a code_challenge — the canonical code-interception attack when
  # combined with attacker-controlled redirect URIs. Enforce both:
  pkce:
    enforced: true
    enforced_for_public_clients: true

oidc:
  dynamic_client_registration:
    enabled: true

# webfinger.oidc_discovery.client_registration_url is set in compose.yml
# via WEBFINGER_OIDC_DISCOVERY_CLIENT_REGISTRATION_URL so it can use the
# same issuer env var as the other URLs. Hydra does not interpolate
# ${VAR} inside its yaml config.

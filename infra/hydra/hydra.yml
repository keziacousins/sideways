version: v2.3.0

serve:
  public:
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:4000
        - https://your-server.example.com
      allowed_methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
      allow_credentials: true

strategies:
  access_token: jwt

log:
  level: info
  format: text

ttl:
  access_token: 24h
  refresh_token: 720h
  id_token: 24h
  auth_code: 10m

oauth2:
  expose_internal_errors: true

# Sideways nginx config
# All services behind one host, port 80.
#
# Path routing:
#   /              → Astro web frontend (:4000)
#   /api/*         → Hono API server (:4100)
#   /oauth2/*      → API server (proxies to Hydra internally)
#   /.well-known/* → API server (proxies to Hydra internally)

upstream web {
    server 127.0.0.1:4000;
}

upstream api {
    server 127.0.0.1:4100;
}

upstream hydra {
    server 127.0.0.1:4444;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;

    # --- Security: block scanner probes ---
    # Dotfiles (except .well-known)
    location ~ /\. {
        if ($uri !~ ^/\.well-known/) {
            return 444;
        }
    }

    # Common probe paths — return connection closed (no response body)
    location ~* /(\.env|\.git|config\.json|secrets\.json|credentials\.json|\.DS_Store|wp-admin|wp-login|phpinfo|phpmyadmin|xmlrpc\.php|administrator|actuator) {
        return 444;
    }

    # Double-encoded path traversal attempts
    location ~* %2f\. {
        return 444;
    }

    # Block requests with no Host header (raw IP scanners)
    if ($host = "") {
        return 444;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy. 'unsafe-inline' is kept on script/style because
    # Astro injects inline hydration scripts and the theme system writes inline
    # <style> blocks; the other directives still constrain image/font/connect
    # destinations, block plugins, prevent clickjacking, and lock down base/
    # form-action. Worth revisiting if/when we migrate to nonce-based CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    # Enable HSTS once the deploy is reachable over HTTPS only. Leaving it
    # off on HTTP-only deploys avoids breaking later TLS rollouts (the
    # browser would otherwise refuse to downgrade).
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- MCP endpoint (SSE / Streamable HTTP) ---
    location /api/mcp {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding off;
    }

    # --- API server ---
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- OAuth2 (direct to Hydra — CSRF cookies must survive round-trip) ---
    location /oauth2/ {
        proxy_pass http://hydra;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- JWKS / OpenID discovery ---
    location /.well-known/ {
        proxy_pass http://hydra;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- Health check (bypass web for monitoring) ---
    location = /health {
        proxy_pass http://api;
    }

    # --- Web frontend (everything else) ---
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

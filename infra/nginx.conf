# Sideways nginx config
# All services behind one host, port 80.
#
# Path routing:
#   /              → Astro web frontend (:4000)
#   /api/*         → Hono API server (:4100)
#   /oauth2/*      → API server (proxies to Hydra internally)
#   /.well-known/* → API server (proxies to Hydra internally)

upstream web {
    server 127.0.0.1:4000;
}

upstream api {
    server 127.0.0.1:4100;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;

    # --- API server ---
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # --- OAuth2 (API server proxies to Hydra) ---
    location /oauth2/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- JWKS / OpenID discovery ---
    location /.well-known/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # --- Health check (bypass web for monitoring) ---
    location = /health {
        proxy_pass http://api;
    }

    # --- Web frontend (everything else) ---
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

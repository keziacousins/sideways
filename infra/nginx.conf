# Sideways production nginx config
# All services behind one domain, one TLS cert.
#
# Path routing:
#   /                → Astro web frontend
#   /api/*           → Hono API server
#   /auth/oauth2/*   → Hydra public endpoints (authorize, token, JWKS)
#   /auth/*          → Astro auth pages (login, signup, callback)
#
# Internal-only services (not exposed):
#   Kratos, Hydra admin, SeaweedFS, Postgres

upstream web {
    server 127.0.0.1:4000;
}

upstream api {
    server 127.0.0.1:4100;
}

upstream hydra_public {
    server 127.0.0.1:4444;
}

server {
    listen 80;
    server_name docs.example.com;

    # Redirect to HTTPS in production
    # return 301 https://$host$request_uri;

    # --- Hydra public endpoints (OAuth2) ---
    # Proxied under /auth/oauth2 so the browser never sees the raw Hydra URL
    location /auth/oauth2/ {
        proxy_pass http://hydra_public/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hydra JWKS (for token validation)
    location /.well-known/ {
        proxy_pass http://hydra_public/.well-known/;
        proxy_set_header Host $host;
    }

    # --- API server ---
    location /api/ {
        proxy_pass http://api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Web frontend (everything else, including /auth/* pages) ---
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# To enable HTTPS, add:
# server {
#     listen 443 ssl;

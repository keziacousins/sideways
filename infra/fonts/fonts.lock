# Redistributable fonts installed into the render images (see fetch-fonts.sh).
# One line per installed file:
#
#   <consumer>  <installed path>  <sha256 of the download>  <url>  [<member, if the download is a zip>]
#
# Consumers take different files from the same pinned downloads:
#
#   print  WeasyPrint. The variable fonts it has always had: print.css asks
#          for "Inter", "Newsreader" and "Fira Code" and these satisfy it, so
#          PDF typesetting does not move when this file changes.
#   typst  The Typst diagram sidecar. Static instances, because Typst does not
#          support variable fonts ("may render incorrectly"). Family names as
#          Typst sees them: "Inter", "Fira Code", "Newsreader 16pt".
#
# The web app does not read this file: it bundles the same families from the
# @fontsource-variable packages. Typst draws text as glyph outlines, so a
# diagram needs its fonts only where it is compiled, not in the reader's browser.
#
# Every URL is pinned (a release tag or a commit) and every download is checked
# against its SHA-256, so an image rebuild cannot silently change the fonts.

